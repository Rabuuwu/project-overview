[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-doctor"
version = "0.1.0"
description = "Read-only portfolio and repository overview CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
project-doctor = "project_doctor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

